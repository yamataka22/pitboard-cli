name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # README のインストール手順は実際のファイル名（pitboard_0.1.1_darwin_arm64.tar.gz など）を
      # 書いているので、この版に更新されていなければリリースしない（make release が更新する）
      - name: Check README refers to this version
        run: grep -q "pitboard_${GITHUB_REF_NAME#v}_" README.md
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
